<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MD. PRINCE — Personal Profile</title>

  <meta name="description"
        content="Official personal profile website of MD. PRINCE — Customer Support & Operations Executive.">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    /* =====================================================
       BASIC
    ====================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(45,212,191,.09), transparent 25%),
        radial-gradient(circle at 90% 20%, rgba(59,130,246,.10), transparent 25%),
        linear-gradient(135deg,#050816,#081120,#0a1020);
      color:#f8fafc;
      line-height:1.7;
      overflow-x:hidden;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      max-width:100%;
    }

    section{
      padding:95px 7%;
      scroll-margin-top:80px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    /* =====================================================
       SCROLL BAR
    ====================================================== */

    ::-webkit-scrollbar{
      width:8px;
    }

    ::-webkit-scrollbar-track{
      background:#050816;
    }

    ::-webkit-scrollbar-thumb{
      background:linear-gradient(#2dd4bf,#3b82f6);
      border-radius:20px;
    }

    /* =====================================================
       NAVBAR
    ====================================================== */

    header{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:9999;

      background:rgba(5,8,22,.75);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      border-bottom:1px solid rgba(255,255,255,.07);
    }

    nav{
      max-width:1250px;
      margin:auto;
      height:72px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 6%;
    }

    .logo{
      font-family:'Poppins',sans-serif;
      font-size:23px;
      font-weight:800;
      letter-spacing:.5px;
      white-space:nowrap;
    }

    .logo span{
      color:#2dd4bf;
    }

    .nav-links{
      display:flex;
      list-style:none;
      align-items:center;
      gap:26px;
    }

    .nav-links a{
      color:#cbd5e1;
      font-size:14px;
      font-weight:600;
      transition:.3s;
      position:relative;
    }

    .nav-links a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-7px;
      width:0;
      height:2px;
      border-radius:10px;
      background:#2dd4bf;
      transition:.3s;
    }

    .nav-links a:hover{
      color:#fff;
    }

    .
