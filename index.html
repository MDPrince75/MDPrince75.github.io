<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MD. PRINCE — Personal Profile</title>
  <meta name="description" content="Personal profile website of MD. PRINCE — Customer Support & Operations Executive.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#050816;
      color:#f8fafc;
      line-height:1.7;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-3;
      background:
        radial-gradient(circle at 10% 20%,rgba(45,212,191,.10),transparent 28%),
        radial-gradient(circle at 90% 20%,rgba(59,130,246,.11),transparent 28%),
        radial-gradient(circle at 50% 90%,rgba(139,92,246,.08),transparent 30%),
        linear-gradient(135deg,#050816,#081120,#070b18);
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      max-width:100%;
      display:block;
    }

    button{
      font-family:inherit;
    }

    section{
      padding:100px 7%;
      scroll-margin-top:75px;
      position:relative;
    }

    .container{
      max-width:1180px;
      margin:auto;
    }

    ::selection{
      background:#2dd4bf;
      color:#04111b;
    }

    ::-webkit-scrollbar{
      width:8px;
    }

    ::-webkit-scrollbar-track{
      background:#050816;
    }

    ::-webkit-scrollbar-thumb{
      background:linear-gradient(#2dd4bf,#3b82f6);
      border-radius:20px;
    }

    /* BACKGROUND ORBS */

    .orb{
      position:fixed;
      border-radius:50%;
      filter:blur(90px);
      opacity:.13;
      pointer-events:none;
      z-index:-2;
      animation:orbMove 12s ease-in-out infinite alternate;
    }

    .orb-one{
      width:300px;
      height:300px;
      background:#2dd4bf;
      top:12%;
      left:-100px;
    }

    .orb-two{
      width:340px;
      height:340px;
      background:#3b82f6;
      right:-130px;
      top:35%;
      animation-delay:2s;
    }

    .orb-three{
      width:280px;
      height:280px;
      background:#8b5cf6;
      bottom:-100px;
      left:40%;
      animation-delay:4s;
    }

    @keyframes orbMove{
      from{
        transform:translate(0,0) scale(1);
      }
      to{
        transform:translate(35px,45px) scale(1.12);
      }
    }

    /* LOADING */

    #loading{
      position:fixed;
      inset:0;
      background:#050816;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:17px;
      transition:.5s;
    }

    .loader{
      width:48px;
      height:48px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.1);
      border-top-color:#2dd4bf;
      border-right-color:#3b82f6;
      animation:spin .8s linear infinite;
    }

    #loading p{
      color:#94a3b8;
      font-size:13px;
      letter-spacing:.5px;
    }

    @keyframes spin{
      to{transform:rotate(360deg);}
    }

    /* NAVBAR */

    header{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:9999;
      background:rgba(5,8,22,.70);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(255,255,255,.07);
    }

    nav{
      max-width:1250px;
      margin:auto;
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 6%;
    }

    .logo{
      font-family:'Poppins',sans-serif;
      font-size:22px;
      font-weight:800;
      letter-spacing:.5px;
      white-space:nowrap;
    }

    .logo span{
      background:linear-gradient(90deg,#2dd4bf,#60a5fa);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .nav-links{
      display:flex;
      list-style:none;
      align-items:center;
      gap:22px;
    }

    .nav-links a{
      color:#cbd5e1;
      font-size:13px;
      font-weight:600;
      position:relative;
      transition:.3s;
    }

    .nav-links a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-7px;
      width:0;
      height:2px;
      border-radius:20px;
      background:linear-gradient(90deg,#2dd4bf,#3b82f6);
      transition:.3s;
    }

    .nav-links a:hover,
    .nav-links a.active-link{
      color:#fff;
    }

    .nav-links a:hover::after,
    .nav-links a.active-link::after{
      width:100%;
    }

    .admin-link{
      border:1px solid rgba(45,212,191,.4);
      padding:8px 13px;
      border-radius:10px;
      color:#2dd4bf !important;
    }

    .admin-link::after{
      display:none;
    }

    .admin-link:hover{
      background:#2dd4bf;
      color:#04111b !important;
      box-shadow:0 0 25px rgba(45,212,191,.2);
    }

    .menu-btn{
      display:none;
      cursor:pointer;
      font-size:24px;
    }

    /* HERO */

    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      padding-top:120px;
    }

    .hero-grid{
      width:100%;
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:70px;
      align-items:center;
    }

    .hello{
      display:inline-flex;
      align-items:center;
      gap:9px;
      color:#2dd4bf;
      font-size:14px;
      font-weight:700;
      margin-bottom:15px;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .hello::before{
      content:"";
      width:30px;
      height:2px;
      background:#2dd4bf;
    }

    .hero h1{
      font-family:'Poppins',sans-serif;
      font-size:clamp(43px,6vw,73px);
      line-height:1.07;
      font-weight:800;
      margin-bottom:14px;
    }

    .hero h1 span{
      background:linear-gradient(90deg,#2dd4bf,#60a5fa,#a78bfa);
      background-size:200%;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:gradientText 5s linear infinite;
    }

    @keyframes gradientText{
      0%{background-position:0%;}
      100%{background-position:200%;}
    }

    .job-title{
      font-size:20px;
      font-weight:600;
      color:#cbd5e1;
      margin-bottom:8px;
    }

    .typing-wrapper{
      height:31px;
      margin-bottom:18px;
      color:#2dd4bf;
      font-weight:700;
      font-size:15px;
    }

    #typingText::after{
      content:"|";
      margin-left:3px;
      animation:blink .7s infinite;
    }

    @keyframes blink{
      50%{opacity:0;}
    }

    .hero-description{
      max-width:650px;
      color:#94a3b8;
      font-size:16px;
      margin-bottom:30px;
    }

    .hero-buttons{
      display:flex;
      flex-wrap:wrap;
      gap:13px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:13px 22px;
      border-radius:11px;
      font-size:14px;
      font-weight:700;
      transition:.3s;
    }

    .btn-primary{
      background:linear-gradient(135deg,#2dd4bf,#3b82f6);
      color:#04111b;
      box-shadow:0 12px 35px rgba(45,212,191,.17);
    }

    .btn-primary:hover{
      transform:translateY(-4px);
      box-shadow:0 16px 40px rgba(45,212,191,.24);
    }

    .btn-outline{
      border:1px solid rgba(255,255,255,.14);
      color:#e2e8f0;
      background:rgba(255,255,255,.03);
    }

    .btn-outline:hover{
      border-color:#2dd4bf;
      color:#2dd4bf;
      transform:translateY(-4px);
    }

    /* PROFILE */

    .hero-image-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .profile-ring{
      width:355px;
      height:355px;
      padding:8px;
      border-radius:50%;
      position:relative;
      background:linear-gradient(135deg,#2dd4bf,#3b82f6,#8b5cf6,#2dd4bf);
      background-size:300% 300%;
      animation:ringGradient 7s ease infinite, floatPhoto 5s ease-in-out infinite;
      box-shadow:
        0 0 75px rgba(45,212,191,.14),
        0 25px 70px rgba(0,0,0,.4);
    }

    @keyframes ringGradient{
      0%{background-position:0 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0 50%;}
    }

    @keyframes floatPhoto{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-10px);}
    }

    .profile-ring::before,
    .profile-ring::after{
      content:"";
      position:absolute;
      border-radius:50%;
      pointer-events:none;
    }

    .profile-ring::before{
      inset:-18px;
      border:1px solid rgba(45,212,191,.2);
      animation:pulseRing 2.8s ease-in-out infinite;
    }

    .profile-ring::after{
      inset:-35px;
      border:1px dashed rgba(96,165,250,.12);
      animation:rotateRing 20s linear infinite;
    }

    @keyframes pulseRing{
      50%{
        transform:scale(1.03);
        opacity:.45;
      }
    }

    @keyframes rotateRing{
      to{transform:rotate(360deg);}
    }

    .profile-image{
      width:100%;
      height:100%;
      border-radius:50%;
      object-fit:cover;
      object-position:center;
      background:#111827;
      border:7px solid #081120;
    }

    /* SECTIONS */

    .section-head{
      margin-bottom:42px;
    }

    .section-label{
      color:#2dd4bf;
      text-transform:uppercase;
      letter-spacing:2px;
      font-size:12px;
      font-weight:800;
      margin-bottom:6px;
    }

    .section-title{
      display:inline-block;
      font-family:'Poppins',sans-serif;
      font-size:33px;
      font-weight:800;
      margin-bottom:15px;
    }

    .section-title::after{
      content:"";
      display:block;
      width:55px;
      height:3px;
      margin-top:7px;
      border-radius:10px;
      background:linear-gradient(90deg,#2dd4bf,#3b82f6);
    }

    .section-subtitle{
      color:#94a3b8;
      max-width:680px;
    }

    /* GLASS CARD */

    .glass-card{
      background:
        linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
      border:1px solid rgba(255,255,255,.085);
      border-radius:22px;
      padding:30px;
      box-shadow:0 18px 60px rgba(0,0,0,.19);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transition:transform .35s,border-color .35s,box-shadow .35s;
    }

    .glass-card:hover{
      transform:translateY(-6px);
      border-color:rgba(45,212,191,.28);
      box-shadow:0 22px 70px rgba(0,0,0,.27);
    }

    /* ABOUT */

    .about-grid{
      display:grid;
      grid-template-columns:.7fr 1.3fr;
      gap:30px;
      align-items:stretch;
    }

    .about-icon-box{
      min-height:260px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
    }

    .big-icon{
      width:90px;
      height:90px;
      border-radius:25px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:37px;
      color:#2dd4bf;
      background:rgba(45,212,191,.09);
      border:1px solid rgba(45,212,191,.2);
      margin-bottom:20px;
      box-shadow:0 0 30px rgba(45,212,191,.08);
    }

    .about-icon-box h3{
      font-size:20px;
      margin-bottom:7px;
    }

    .about-icon-box p{
      color:#94a3b8;
      font-size:14px;
    }

    .about-text{
      color:#cbd5e1;
      white-space:pre-line;
    }

    /* INFO */

    .info-card{
      position:relative;
      overflow:hidden;
    }

    .info-card::before{
      content:"";
      position:absolute;
      width:120px;
      height:120px;
      border-radius:50%;
      background:#2dd4bf;
      filter:blur(80px);
      opacity:.08;
      right:-30px;
      top:-30px;
    }

    .card-icon{
      width:54px;
      height:54px;
      border-radius:15px;
      background:rgba(45,212,191,.09);
      color:#2dd4bf;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:21px;
      margin-bottom:18px;
      border:1px solid rgba(45,212,191,.15);
    }

    .info-card h3{
      font-family:'Poppins',sans-serif;
      font-size:19px;
      margin-bottom:12px;
    }

    .info-card p{
      color:#aebdce;
      font-size:15px;
      white-space:pre-line;
    }

    /* VIDEO / STORY */

    .story-grid{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:25px;
      align-items:stretch;
    }

    .video-card{
      padding:12px;
      overflow:hidden;
    }

    .video-container{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      border-radius:15px;
      overflow:hidden;
      background:
        radial-gradient(circle at center,rgba(45,212,191,.12),transparent 45%),
        #030712;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .video-container video,
    .video-container iframe{
      width:100%;
      height:100%;
      border:0;
      object-fit:cover;
    }

    .video-placeholder{
      text-align:center;
      color:#94a3b8;
      padding:30px;
    }

    .video-placeholder i{
      display:flex;
      align-items:center;
      justify-content:center;
      width:70px;
      height:70px;
      margin:0 auto 15px;
      border-radius:50%;
      background:linear-gradient(135deg,#2dd4bf,#3b82f6);
      color:#04111b;
      font-size:25px;
      box-shadow:0 0 35px rgba(45,212,191,.2);
    }

    .story-content{
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .story-content h3{
      font-family:'Poppins',sans-serif;
      font-size:24px;
      margin-bottom:12px;
    }

    .story-content p{
      color:#aebdce;
    }

    /* CONTACT */

    .contact-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:22px;
    }

    .contact-item{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .contact-icon{
      min-width:50px;
      width:50px;
      height:50px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(45,212,191,.09);
      color:#2dd4bf;
      border:1px solid rgba(45,212,191,.17);
      font-size:19px;
    }

    .contact-item small{
      display:block;
      color:#64748b;
      margin-bottom:2px;
    }

    .contact-value{
      color:#e2e8f0;
      font-weight:600;
      word-break:break-word;
    }

    /* SOCIAL */

    .social-wrap{
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
      margin-top:38px;
    }

    .social-btn{
      width:49px;
      height:49px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.08);
      font-size:19px;
      transition:.3s;
      color:#cbd5e1;
    }

    .social-btn:hover{
      background:linear-gradient(135deg,#2dd4bf,#3b82f6);
      border-color:transparent;
      color:#04111b;
      transform:translateY(-5px) scale(1.05);
    }

    /* FOOTER */

    footer{
      border-top:1px solid rgba(255,255,255,.07);
      background:rgba(3,7,18,.65);
      padding:31px 7%;
      text-align:center;
      color:#64748b;
      font-size:13px;
    }

    footer span{
      color:#2dd4bf;
      font-weight:700;
    }

    /* REVEAL */

    .reveal{
      opacity:0;
      transform:translateY(35px);
      transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.2,.7,.2,1);
    }

    .reveal.active{
      opacity:1;
      transform:translateY(0);
    }

    /* MOBILE */

    @media(max-width:900px){

      section{
        padding:80px 6%;
      }

      .menu-btn{
        display:block;
      }

      .nav-links{
        position:absolute;
        top:72px;
        left:0;
        width:100%;
        padding:25px 6%;
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
        background:rgba(5,8,22,.97);
        border-bottom:1px solid rgba(255,255,255,.08);
        transform:translateY(-150%);
        opacity:0;
        pointer-events:none;
        transition:.3s;
      }

      .nav-links.active{
        transform:translateY(0);
        opacity:1;
        pointer-events:auto;
      }

      .hero{
        text-align:center;
        padding-top:130px;
      }

      .hero-grid{
        grid-template-columns:1fr;
        gap:50px;
      }

      .hero-content{
        order:2;
      }

      .hero-image-wrap{
        order:1;
      }

      .hello{
        justify-content:center;
      }

      .hero-description{
        margin-left:auto;
        margin-right:auto;
      }

      .hero-buttons{
        justify-content:center;
      }

      .profile-ring{
        width:280px;
        height:280px;
      }

      .about-grid,
      .story-grid,
      .contact-grid{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:520px){

      nav{
        padding:0 5%;
      }

      .logo{
        font-size:18px;
      }

      section{
        padding:70px 5%;
      }

      .hero h1{
        font-size:40px;
      }

      .job-title{
        font-size:17px;
      }

      .typing-wrapper{
        font-size:13px;
      }

      .profile-ring{
        width:235px;
        height:235px;
      }

      .section-title{
        font-size:27px;
      }

      .glass-card{
        padding:23px;
      }

      .video-card{
        padding:9px;
      }

      .hero-buttons{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>
  <div class="orb orb-three"></div>

  <div id="loading">
    <div class="loader"></div>
    <p>Loading profile...</p>
  </div>

  <!-- NAVBAR -->

  <header>
    <nav>

      <a href="#home" class="logo">
        MD. <span>PRINCE</span>
      </a>

      <ul class="nav-links" id="navLinks">

        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#career">Career</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#family">Family</a></
